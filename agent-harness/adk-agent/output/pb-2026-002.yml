# ============================================================
# Playbook: Create application service account and configure limited sudo access
# Request ID: PB-2026-002
# Generated for: db-prod-01, db-prod-02, db-prod-03
# OS: Red Hat Enterprise Linux 8.9
# Requested by: Marcus Webb on 2026-06-20
# ============================================================
#
# Expected inventory entries:
# [db_servers]
# db-prod-01 ansible_host=192.168.20.10
# db-prod-02 ansible_host=192.168.20.11
# db-prod-03 ansible_host=192.168.20.12

---
- name: Create application service account and configure limited sudo access
  hosts: db_servers
  become: true
  
  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    appuser_uid: 1500
    appuser_gid: 1500
    appuser_home: /opt/appuser
    appuser_ssh_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7vX... appuser@controller"
  
  tasks:
    - name: Create appgroup with GID 1500
      ansible.builtin.group:
        name: appgroup
        gid: "{{ appuser_gid }}"
        state: present
    
    - name: Create appuser system account
      ansible.builtin.user:
        name: appuser
        uid: "{{ appuser_uid }}"
        group: appgroup
        home: "{{ appuser_home }}"
        shell: /bin/bash
        password: '!'
        create_home: true
        state: present
    
    - name: Set home directory permissions for appuser
      ansible.builtin.file:
        path: "{{ appuser_home }}"
        owner: appuser
        group: appgroup
        mode: '0700'
        state: directory
    
    - name: Add SSH authorized key for appuser
      ansible.posix.authorized_key:
        user: appuser
        key: "{{ appuser_ssh_key }}"
        state: present
    
    - name: Create sudoers rule for appuser to run start.sh
      community.general.sudoers:
        name: appuser-start
        user: appuser
        commands: /opt/app/bin/start.sh
        nopassword: true
        validate: true
        state: present
    
    - name: Create sudoers rule for appuser to run stop.sh
      community.general.sudoers:
        name: appuser-stop
        user: appuser
        commands: /opt/app/bin/stop.sh
        nopassword: true
        validate: true
        state: present
    
    - name: Verify appuser account exists
      ansible.builtin.getent:
        database: passwd
        key: appuser
      register: appuser_info
    
    - name: Display appuser account information
      ansible.builtin.debug:
        msg: "appuser account: UID={{ appuser_info.ansible_facts.getent_passwd.appuser[1] }}, GID={{ appuser_info.ansible_facts.getent_passwd.appuser[2] }}, Home={{ appuser_info.ansible_facts.getent_passwd.appuser[4] }}, Shell={{ appuser_info.ansible_facts.getent_passwd.appuser[5] }}"
    
    - name: Verify home directory permissions
      ansible.builtin.stat:
        path: "{{ appuser_home }}"
      register: home_dir_stat
    
    - name: Display home directory permissions
      ansible.builtin.debug:
        msg: "{{ appuser_home }} permissions: mode={{ home_dir_stat.stat.mode }}, owner={{ home_dir_stat.stat.pw_name }}, group={{ home_dir_stat.stat.gr_name }}"
    
    - name: Verify sudoers configuration
      ansible.builtin.command:
        cmd: sudo -l -U appuser
      register: sudo_check
      changed_when: false
    
    - name: Display sudo privileges for appuser
      ansible.builtin.debug:
        msg: "{{ sudo_check.stdout_lines }}"
