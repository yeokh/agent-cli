# ============================================================
# Playbook: Create application service account and configure limited sudo access
# Request ID: PB-2026-002
# Generated for: db-prod-01, db-prod-02, db-prod-03
# OS: Red Hat Enterprise Linux 8.9
# Requested by: Marcus Webb on 2026-06-20
# ============================================================

# Expected inventory entries:
# [db_servers]
# db-prod-01 ansible_host=192.168.20.10
# db-prod-02 ansible_host=192.168.20.11
# db-prod-03 ansible_host=192.168.20.12

---
- name: Create application service account and configure limited sudo access
  hosts: db_servers
  become: true
  gather_facts: true

  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    appuser_name: appuser
    appuser_uid: 1500
    appuser_group: appgroup
    appuser_gid: 1500
    appuser_home: /opt/appuser
    appuser_shell: /bin/bash
    appuser_ssh_pubkey: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7vX... appuser@controller"

  tasks:
    - name: Create appgroup group
      ansible.builtin.group:
        name: "{{ appuser_group }}"
        gid: "{{ appuser_gid }}"
        state: present

    - name: Create appuser service account
      ansible.builtin.user:
        name: "{{ appuser_name }}"
        uid: "{{ appuser_uid }}"
        group: "{{ appuser_group }}"
        home: "{{ appuser_home }}"
        shell: "{{ appuser_shell }}"
        password: '!'
        state: present
        createhome: true

    - name: Set home directory permissions (700 - only accessible by appuser)
      ansible.builtin.file:
        path: "{{ appuser_home }}"
        owner: "{{ appuser_name }}"
        group: "{{ appuser_group }}"
        mode: '0700'
        state: directory

    - name: Create .ssh directory for appuser
      ansible.builtin.file:
        path: "{{ appuser_home }}/.ssh"
        owner: "{{ appuser_name }}"
        group: "{{ appuser_group }}"
        mode: '0700'
        state: directory

    - name: Deploy SSH public key for appuser
      ansible.posix.authorized_key:
        user: "{{ appuser_name }}"
        state: present
        key: "{{ appuser_ssh_pubkey }}"
        comment: "appuser@controller"

    - name: Create sudoers entry for appuser with limited commands
      community.general.sudoers:
        name: appuser-limited
        state: present
        user: "{{ appuser_name }}"
        commands:
          - /opt/app/bin/start.sh
          - /opt/app/bin/stop.sh
        nopasswd: true
        validate: true

    - name: Verify appuser account exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ appuser_name }}"

    - name: Display appuser account information
      ansible.builtin.debug:
        msg: |
          User: {{ appuser_name }}
          UID: {{ ansible_facts.getent_passwd[appuser_name][1] }}
          GID: {{ ansible_facts.getent_passwd[appuser_name][2] }}
          Home: {{ ansible_facts.getent_passwd[appuser_name][4] }}
          Shell: {{ ansible_facts.getent_passwd[appuser_name][5] }}

    - name: Verify home directory ownership and permissions
      ansible.builtin.stat:
        path: "{{ appuser_home }}"
      register: home_stat

    - name: Assert home directory has correct permissions
      ansible.builtin.assert:
        that:
          - home_stat.stat.pw_name == appuser_name
          - home_stat.stat.gr_name == appuser_group
          - home_stat.stat.mode == '0700'
        fail_msg: "Home directory ownership or permissions are incorrect"
        success_msg: "Home directory has correct ownership and permissions (700)"

    - name: Verify authorized_keys file exists
      ansible.builtin.stat:
        path: "{{ appuser_home }}/.ssh/authorized_keys"
      register: authkeys_stat

    - name: Verify SSH public key is installed
      ansible.builtin.assert:
        that:
          - authkeys_stat.stat.exists
          - authkeys_stat.stat.pw_name == appuser_name
        fail_msg: "SSH public key is not properly installed for appuser"
        success_msg: "SSH public key is installed for appuser"

    - name: Verify sudoers entry for appuser
      ansible.builtin.command:
        cmd: sudo -U {{ appuser_name }} -l
      register: sudo_list
      changed_when: false

    - name: Display sudoers privileges
      ansible.builtin.debug:
        msg: "Sudoers privileges for {{ appuser_name }}: {{ sudo_list.stdout }}"
