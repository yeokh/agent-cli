# ============================================================
# Playbook: Install IIS and deploy placeholder corporate website
# Request ID: PB-2026-004
# Generated for: win-web-01, win-web-02
# OS: Windows Server 2019 Standard
# Requested by: Daniel Osei on 2026-06-20
# ============================================================
#
# Expected inventory entries:
# [web_servers]
# win-web-01 ansible_host=10.10.9.51
# win-web-02 ansible_host=10.10.9.52

---
- name: Install IIS and deploy placeholder corporate website
  hosts: web_servers
  become: false
  
  vars:
    ansible_connection: winrm
    ansible_user: ansible_svc
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
    site_root: C:\inetpub\sites\corpsite
    app_pool_name: CorpSitePool
    website_name: CorpSite
  
  tasks:
    - name: Install IIS Web Server role with required features
      ansible.windows.win_feature:
        name:
          - Web-Server
          - Web-Static-Content
          - Web-Default-Doc
          - Web-Http-Logging
          - Web-Request-Monitor
          - Web-Filtering
          - Web-Stat-Compression
        state: present
        include_management_tools: true
      register: iis_install
    
    - name: Reboot if IIS installation requires it
      ansible.windows.win_reboot:
        reboot_timeout: 600
      when: iis_install.reboot_required
    
    - name: Ensure IIS web service (W3SVC) is running and enabled
      ansible.windows.win_service:
        name: W3SVC
        state: started
        start_mode: auto
    
    - name: Create website content directory
      ansible.windows.win_file:
        path: "{{ site_root }}"
        state: directory
    
    - name: Deploy placeholder index.html
      ansible.windows.win_copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Corporate Portal</title>
          </head>
          <body>
              <h1>Site coming soon.</h1>
          </body>
          </html>
        dest: "{{ site_root }}\\index.html"
    
    - name: Create IIS application pool (CorpSitePool)
      community.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: started
        attributes:
          managedRuntimeVersion: ''
          managedPipelineMode: Integrated
    
    - name: Stop Default Web Site to avoid port 80 conflict
      community.windows.win_iis_website:
        name: Default Web Site
        state: stopped
    
    - name: Create CorpSite IIS website
      community.windows.win_iis_website:
        name: "{{ website_name }}"
        physical_path: "{{ site_root }}"
        application_pool: "{{ app_pool_name }}"
        state: started
        bindings:
          - protocol: http
            port: 80
            ip: '*'
            host_header: corpsite.example.com
    
    - name: Create Windows Firewall rule for HTTP (port 80)
      ansible.windows.win_firewall_rule:
        name: Allow HTTP Traffic
        localport: 80
        action: allow
        direction: in
        protocol: tcp
        state: enabled
        enabled: true
    
    - name: Verify W3SVC service status
      ansible.windows.win_service_info:
        name: W3SVC
      register: w3svc_status
    
    - name: Display W3SVC service status
      ansible.builtin.debug:
        msg: "W3SVC service state: {{ w3svc_status.services[0].state }}, start_mode: {{ w3svc_status.services[0].start_mode }}"
    
    - name: Verify CorpSitePool application pool status
      ansible.windows.win_shell: |
        Import-Module WebAdministration
        $pool = Get-Item "IIS:\AppPools\{{ app_pool_name }}" -ErrorAction SilentlyContinue
        if ($pool) {
          "Name: $($pool.Name), State: $($pool.State), RuntimeVersion: $($pool.managedRuntimeVersion), PipelineMode: $($pool.managedPipelineMode)"
        } else {
          "Application pool not found"
        }
      register: apppool_check
      changed_when: false
    
    - name: Display application pool status
      ansible.builtin.debug:
        msg: "{{ apppool_check.stdout_lines }}"
    
    - name: Verify CorpSite website status
      ansible.windows.win_shell: |
        Import-Module WebAdministration
        $site = Get-Website -Name "{{ website_name }}" -ErrorAction SilentlyContinue
        if ($site) {
          $binding = $site.bindings.Collection[0]
          "Name: $($site.Name), State: $($site.State), PhysicalPath: $($site.PhysicalPath), Binding: $($binding.protocol)://$($binding.bindingInformation)"
        } else {
          "Website not found"
        }
      register: website_check
      changed_when: false
    
    - name: Display website status
      ansible.builtin.debug:
        msg: "{{ website_check.stdout_lines }}"
    
    - name: Verify Default Web Site is stopped
      ansible.windows.win_shell: |
        Import-Module WebAdministration
        $site = Get-Website -Name "Default Web Site" -ErrorAction SilentlyContinue
        if ($site) {
          "Default Web Site state: $($site.State)"
        } else {
          "Default Web Site not found"
        }
      register: default_site_check
      changed_when: false
    
    - name: Display Default Web Site status
      ansible.builtin.debug:
        msg: "{{ default_site_check.stdout_lines }}"
    
    - name: Test HTTP connectivity to localhost
      ansible.windows.win_shell: |
        try {
          $response = Invoke-WebRequest -Uri "http://localhost" -Headers @{Host="corpsite.example.com"} -UseBasicParsing -TimeoutSec 5
          "HTTP Status: $($response.StatusCode), Content length: $($response.Content.Length) bytes"
        } catch {
          "HTTP test failed: $($_.Exception.Message)"
        }
      register: http_test
      changed_when: false
    
    - name: Display HTTP test result
      ansible.builtin.debug:
        msg: "{{ http_test.stdout_lines }}"
