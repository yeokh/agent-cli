---
- name: Configure firewall for new Java web application
  hosts: web-prod-01
  become: true
  gather_facts: true

  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:
    - name: Ensure firewalld is running and enabled
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Open firewall port 8080 TCP (Java app HTTP)
      ansible.posix.firewalld:
        port: 8080/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Open firewall port 8443 TCP (Java app HTTPS)
      ansible.posix.firewalld:
        port: 8443/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Open firewall port 9090 TCP (WildFly admin console)
      ansible.posix.firewalld:
        port: 9090/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Verify firewall service is running
      ansible.builtin.systemd:
        name: firewalld
        state: started
      register: firewall_status

    - name: Display firewall service status
      ansible.builtin.debug:
        msg: "Firewall service status: {{ firewall_status.state }}"

    - name: Verify all required ports are open
      ansible.builtin.command:
        cmd: firewall-cmd --list-ports
      register: firewall_ports
      changed_when: false

    - name: Display open ports
      ansible.builtin.debug:
        msg: "Currently open ports: {{ firewall_ports.stdout }}"

    - name: Verify required ports are in the list
      ansible.builtin.assert:
        that:
          - "'8080/tcp' in firewall_ports.stdout"
          - "'8443/tcp' in firewall_ports.stdout"
          - "'9090/tcp' in firewall_ports.stdout"
        fail_msg: "One or more required ports are not open"
        success_msg: "All required firewall ports are open"
