# ============================================================

---
- name: Configure firewall for new Java web application
  hosts: web-prod-01
  become: true
  
  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  
  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.dnf:
        name: firewalld
        state: present
    
    - name: Ensure firewalld is running and enabled
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
    
    - name: Open port 8080/tcp for Java app HTTP traffic
      ansible.posix.firewalld:
        port: 8080/tcp
        permanent: true
        immediate: true
        state: enabled
    
    - name: Open port 8443/tcp for Java app HTTPS traffic
      ansible.posix.firewalld:
        port: 8443/tcp
        permanent: true
        immediate: true
        state: enabled
    
    - name: Open port 9090/tcp for WildFly admin console
      ansible.posix.firewalld:
        port: 9090/tcp
        permanent: true
        immediate: true
        state: enabled
    
    - name: Verify firewalld service status
      ansible.builtin.systemd:
        name: firewalld
      register: firewalld_status
    
    - name: Display firewalld service status
      ansible.builtin.debug:
        msg: "Firewalld is {{ firewalld_status.status.ActiveState }} and {{ firewalld_status.status.UnitFileState }}"
    
    - name: List active firewall ports
      ansible.builtin.command:
        cmd: firewall-cmd --list-ports
      register: active_ports
      changed_when: false
    
    - name: Display active firewall ports
      ansible.builtin.debug:
        msg: "Active firewall ports: {{ active_ports.stdout }}"
    
    - name: List permanent firewall ports
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --list-ports
      register: permanent_ports
      changed_when: false
    
    - name: Display permanent firewall ports
      ansible.builtin.debug:
        msg: "Permanent firewall ports: {{ permanent_ports.stdout }}"
