# ============================================================
# Playbook: Create application service account and configure limited sudo access
# Request ID: PB-2026-002
# Generated for: db-prod-01, db-prod-02, db-prod-03
# OS: Red Hat Enterprise Linux 8.9
# Requested by: Marcus Webb on 2026-06-20
# ============================================================
# Expected inventory entries:
# [create_application_service_account_and_configure_limited_sudo_access]
# db-prod-01 ansible_host=192.168.20.10
# db-prod-02 ansible_host=192.168.20.11
# db-prod-03 ansible_host=192.168.20.12

- name: Create application service account and configure limited sudo access
  hosts: create_application_service_account_and_configure_limited_sudo_access
  become: true
  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:
    - name: Ensure group 'appgroup' exists with GID 1500
      ansible.builtin.group:
        name: appgroup
        gid: 1500
        state: present

    - name: Ensure user 'appuser' exists with UID 1500 and home /opt/appuser
      ansible.builtin.user:
        name: appuser
        uid: 1500
        group: appgroup
        home: /opt/appuser
        create_home: yes
        shell: /bin/bash
        password: '!'    # account with no password (disabled password login)
        state: present

    - name: Ensure /opt/appuser directory exists with correct ownership and permissions
      ansible.builtin.file:
        path: /opt/appuser
        state: directory
        owner: appuser
        group: appgroup
        mode: '0700'

    - name: Ensure .ssh directory exists with correct permissions
      ansible.builtin.file:
        path: /opt/appuser/.ssh
        state: directory
        owner: appuser
        group: appgroup
        mode: '0700'

    - name: Authorize provided SSH public key for appuser
      ansible.posix.authorized_key:
        user: appuser
        state: present
        key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7vX... appuser@controller"

    - name: Ensure ownership and permissions of authorized_keys
      ansible.builtin.file:
        path: /opt/appuser/.ssh/authorized_keys
        owner: appuser
        group: appgroup
        mode: '0600'

    - name: Ensure sudoers entry allowing appuser to run start/stop without password
      community.general.sudoers:
        name: appuser_limited_sudo
        user: appuser
        host: ALL
        runas: root
        commands:
          - /opt/app/bin/start.sh
          - /opt/app/bin/stop.sh
        nopasswd: true
        state: present
        validate: true

    - name: Validation - confirm appuser exists
      ansible.builtin.command:
        cmd: getent passwd appuser
      register: passwd_entry
      changed_when: false

    - name: Show passwd entry for appuser
      ansible.builtin.debug:
        var: passwd_entry.stdout

    - name: Validation - confirm appgroup exists
      ansible.builtin.command:
        cmd: getent group appgroup
      register: group_entry
      changed_when: false

    - name: Show group entry for appgroup
      ansible.builtin.debug:
        var: group_entry.stdout

    - name: Validation - stat /opt/appuser
      ansible.builtin.stat:
        path: /opt/appuser
      register: homestat

    - name: Show /opt/appuser stat
      ansible.builtin.debug:
        var: homestat.stat

    - name: Validation - check authorized_keys contains the public key
      ansible.builtin.command:
        cmd: grep -F "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7vX... appuser@controller" /opt/appuser/.ssh/authorized_keys || true
      register: key_check
      changed_when: false

    - name: Show authorized_keys check
      ansible.builtin.debug:
        var: key_check.stdout

    - name: Validation - check sudoers file exists for appuser
      ansible.builtin.stat:
        path: /etc/sudoers.d/appuser_limited_sudo
      register: sudoers_stat

    - name: Show sudoers file stat
      ansible.builtin.debug:
        var: sudoers_stat.stat

    - name: Validation - show sudoers content for appuser
      ansible.builtin.command:
        cmd: sed -n '1,200p' /etc/sudoers.d/appuser_limited_sudo || true
      register: sudoers_content
      changed_when: false

    - name: Show sudoers content
      ansible.builtin.debug:
        var: sudoers_content.stdout
