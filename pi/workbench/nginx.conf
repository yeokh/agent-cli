# Non-root nginx config — all writable paths go to /tmp
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Temp paths writable by arbitrary UID
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Honour X-Forwarded-Proto from the OpenShift router
    map $http_x_forwarded_proto $custom_scheme {
        default $scheme;
        https   https;
    }

    server {
        listen 8080;
        access_log /dev/stdout;
        error_log  /dev/stderr warn;

        # Server-specific locations generated at startup from NB_PREFIX
        include /tmp/nginx-server.conf;
    }
}
