apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-model-config
  labels:
    app: distribution-starter
data:
  # Multi-provider routing setup for OGX
  run.yaml: |
    version: '2'
    image_name: starter
    apis:
      - inference
    providers:
      inference:
        - provider_id: openai-backend
          provider_type: remote::openai
          config:
            api_key: "${OPENAI_API_KEY}"
        - provider_id: openrouter-backend
          provider_type: remote::openai
          config:
            base_url: "https://openrouter.ai/api/v1"
            api_key: "${OPENROUTER_API_KEY}"
            allowed_models:
              - deepseek/deepseek-r1
              - anthropic/claude-haiku-4.5
              - openai/gpt-5.4-nano
              - openai/gpt-5-mini
              - ibm-granite/granite-4.1-8b
        # MaaS is proxies by LiteLLM, otherwise may need to use remote::vllm
        - provider_id: redhat-backend
          provider_type: remote::openai
          config:
            base_url: "https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com/v1"
            api_key: "${REDHAT_API_KEY}"
        - provider_id: anthropic-backend
          provider_type: remote::anthropic
          config:
            api_key: "${ANTHROPIC_API_KEY}"
            allowed_models:
              - claude-haiku-4-5-20251001
    models:
      # Your app uses provider_id/model_id or model_id.  The provider_model_id is the provider's own model id.
      # --- Native OpenAI Fleet ---
      - model_id: "gpt-5-mini"
        provider_id: openai-backend
        provider_model_id: "gpt-5-mini"
      - model_id: "gpt-5-nano"
        provider_id: openai-backend
        provider_model_id: "gpt-5-nano"

      # --- OpenRouter Fleet ---
      - model_id: "deepseek/deepseek-r1"
        provider_id: openrouter-backend
        provider_model_id: "deepseek/deepseek-r1"
      - model_id: "anthropic/claude-haiku-4.5"
        provider_id: openrouter-backend
        provider_model_id: "anthropic/claude-haiku-4.5"
      - model_id: "openai/gpt-5.4-nano"
        provider_id: openrouter-backend
        provider_model_id: "openai/gpt-5.4-nano"
      - model_id: "openai/gpt-5-mini"
        provider_id: openrouter-backend
        provider_model_id: "openai/gpt-5-mini"
      - model_id: "ibm-granite/granite-4.1-8b"
        provider_id: openrouter-backend
        provider_model_id: "ibm-granite/granite-4.1-8b"

      # --- Native Red Hat Fleet ---
      - model_id: "Qwen3.6-35B-A3B"
        provider_id: redhat-backend
        provider_model_id: "Qwen3.6-35B-A3B"
      - model_id: "Qwen2.5-VL-7B-Instruc"
        provider_id: redhat-backend
        provider_model_id: "Qwen2.5-VL-7B-Instruc"
      
      # --- Native Anthropic Fleet ---
      - model_id: "claude-haiku-4.5"
        provider_id: anthropic-backend
        provider_model_id: "claude-haiku-4.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distribution-starter
  labels:
    app: distribution-starter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distribution-starter
  template:
    metadata:
      labels:
        app: distribution-starter
    spec:
      initContainers:
      - name: config-init
        image: bhgedigital/envsubst:latest
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: OPENAI_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: OPENROUTER_API_KEY
        - name: REDHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: REDHAT_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: ANTHROPIC_API_KEY
        command: ["/bin/sh", "-c"]
        args:
          - envsubst < /etc/ogx-template/run.yaml > /etc/ogx/run.yaml
        volumeMounts:
        - name: config-volume
          mountPath: "/etc/ogx-template"
        - name: config-processed
          mountPath: "/etc/ogx"
      containers:
      - name: distribution-starter
        image: ogxai/distribution-starter:latest
        ports:
        - containerPort: 8321
          protocol: TCP
        command: ["ogx", "run", "--insecure", "/etc/ogx/run.yaml"]
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: OPENAI_API_KEY
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: OPENROUTER_API_KEY
        - name: REDHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: REDHAT_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: distribution-starter-secret
              key: ANTHROPIC_API_KEY
        - name: RUN_CONFIG_PATH
          value: "/etc/ogx/run.yaml"
        volumeMounts:
        - name: config-processed
          mountPath: "/etc/ogx"
      volumes:
      - name: config-volume
        configMap:
          name: ogx-model-config
      - name: config-processed
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: distribution-starter-service
  labels:
    app: distribution-starter
spec:
  ports:
  - port: 8321
    targetPort: 8321
  selector:
    app: distribution-starter
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: distribution-starter-route
  labels:
    app: distribution-starter
spec:
  to:
    kind: Service
    name: distribution-starter-service
  port:
    targetPort: 8321
  tls:
    termination: edge
