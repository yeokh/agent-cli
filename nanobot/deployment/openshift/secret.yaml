# nanobot API key Secret
#
# Do NOT commit real keys.  Populate with:
#   oc create secret generic nanobot-api-keys \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=NANOBOT_WEB_TOKEN=<your-token>
#
# Or apply this template after substituting placeholders:
#   ANTHROPIC_API_KEY=sk-ant-... NANOBOT_WEB_TOKEN=... \
#     envsubst < openshift/secret.yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: nanobot-api-keys
  labels:
    app: nanobot
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<set-via-oc-create-secret>"
  NANOBOT_WEB_TOKEN: "<set-via-oc-create-secret>"
