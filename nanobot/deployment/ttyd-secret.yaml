# nanobot ttyd API key Secret
#
# Create with oc (recommended — avoids storing keys in YAML files):
#
#   Anthropic:
#   oc create secret generic nanobot-ttyd-api-keys \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=NANOBOT_AGENTS__DEFAULTS__MODEL=anthropic/claude-opus-4-5 \
#     --from-literal=NANOBOT_AGENTS__DEFAULTS__PROVIDER=anthropic
#
#   OpenAI:
#   oc create secret generic nanobot-ttyd-api-keys \
#     --from-literal=OPENAI_API_KEY=sk-proj-... \
#     --from-literal=NANOBOT_AGENTS__DEFAULTS__MODEL=openai/gpt-4o \
#     --from-literal=NANOBOT_AGENTS__DEFAULTS__PROVIDER=openai
#
#   Google Gemini:
#   oc create secret generic nanobot-ttyd-api-keys \
#     --from-literal=GEMINI_API_KEY=AIza... \
#     --from-literal=NANOBOT_AGENTS__DEFAULTS__MODEL=gemini/gemini-2.0-flash \
#     --from-literal=NANOBOT_AGENTS__DEFAULTS__PROVIDER=gemini
#
# ─────────────────────────────────────────────────────────────────────────────
# Only use this file for declarative Secret management (e.g. GitOps).
# DO NOT commit real keys to git. Use sealed-secrets, Vault, or oc create.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: nanobot-ttyd-api-keys
  labels:
    app: nanobot-ttyd
type: Opaque
stringData:
  # ── Provider API keys (set the one matching your chosen provider) ──────────
  ANTHROPIC_API_KEY: ""         # sk-ant-...
  OPENAI_API_KEY: ""            # sk-proj-...
  GEMINI_API_KEY: ""            # AIza...

  # ── Model and provider selection ──────────────────────────────────────────
  # NANOBOT_AGENTS__DEFAULTS__PROVIDER: "auto"    # auto | anthropic | openai | gemini
  # NANOBOT_AGENTS__DEFAULTS__MODEL: "anthropic/claude-opus-4-5"

  # ── ttyd command (agent | webui | bash) ───────────────────────────────────
  # NANOBOT_TTYD_CMD: "agent"
