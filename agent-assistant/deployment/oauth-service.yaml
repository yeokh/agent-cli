apiVersion: v1
kind: Service
metadata:
  name: pydantic-assistant-oauth
  labels:
    app: pydantic-assistant
    variant: oauth
  annotations:
    # OpenShift will automatically create Secret "pydantic-assistant-tls"
    # containing tls.crt and tls.key, signed by the cluster CA.
    # The oauth-proxy sidecar mounts this secret for its HTTPS listener.
    service.alpha.openshift.io/serving-cert-secret-name: pydantic-assistant-tls
spec:
  selector:
    app: pydantic-assistant
    variant: oauth
  ports:
    - name: oauth-proxy
      port: 4443
      targetPort: 4443
      protocol: TCP
