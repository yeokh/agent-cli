apiVersion: v1
kind: ServiceAccount
metadata:
  name: pydantic-assistant
  labels:
    app: pydantic-assistant
  annotations:
    # Registers the OAuth redirect URI to point at the oauth Route.
    # OpenShift uses this to auto-create an OAuthClient for this ServiceAccount.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"pydantic-assistant-oauth"}}
