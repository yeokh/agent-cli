# Add to Software Catalog cluster-wide or by namespace
# oc apply -f pydantic-assistant-catalog-template.yaml -n openshift
# oc apply -f pydantic-assistant-catalog-template.yaml
#
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: pydantic-assistant-template
  annotations:
    openshift.io/display-name: "Pydantic Assistant (Chat Web UI)"
    description: "Deploys the interactive multi-turn AI chat assistant built on Pydantic AI and Flask."
    openshift.io/provider-display-name: "RH Workshop"
    iconClass: "icon-python"
    tags: "python,pydantic-ai,chat,ai-assistant,web"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: "${APP_NAME}"
      labels:
        app: "${APP_NAME}"
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: "${APP_NAME}"
      template:
        metadata:
          labels:
            app: "${APP_NAME}"
        spec:
          containers:
            - name: pydantic-assistant
              image: "${IMAGE_NAME}"
              ports:
                - containerPort: ${{PORT}}
                  protocol: TCP
              env:
                - name: API_PROVIDER
                  value: "${API_PROVIDER}"
                - name: MODEL
                  value: "${MODEL}"
                - name: MAX_TURNS
                  value: "${MAX_TURNS}"
                - name: MAX_OUTPUT_TOKENS
                  value: "${MAX_OUTPUT_TOKENS}"
                - name: ALLOW_SHELL
                  value: "${ALLOW_SHELL}"
                - name: PORT
                  value: "${PORT}"
                - name: HOST
                  value: "0.0.0.0"
              volumeMounts:
                - name: agent-volume
                  mountPath: /app/agent
                - name: input-volume
                  mountPath: /app/input
                - name: output-volume
                  mountPath: /app/output
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              livenessProbe:
                httpGet:
                  path: /
                  port: ${{PORT}}
                initialDelaySeconds: 15
                periodSeconds: 30
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /
                  port: ${{PORT}}
                initialDelaySeconds: 5
                periodSeconds: 10
          volumes:
            - name: agent-volume
              persistentVolumeClaim:
                claimName: "${APP_NAME}-agent-pvc"
            - name: input-volume
              persistentVolumeClaim:
                claimName: "${APP_NAME}-input-pvc"
            - name: output-volume
              persistentVolumeClaim:
                claimName: "${APP_NAME}-output-pvc"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: "${APP_NAME}-agent-pvc"
      labels:
        app: "${APP_NAME}"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "${AGENT_STORAGE_SIZE}"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: "${APP_NAME}-input-pvc"
      labels:
        app: "${APP_NAME}"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "${INPUT_STORAGE_SIZE}"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: "${APP_NAME}-output-pvc"
      labels:
        app: "${APP_NAME}"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "${OUTPUT_STORAGE_SIZE}"
  - apiVersion: v1
    kind: Service
    metadata:
      name: "${APP_NAME}"
      labels:
        app: "${APP_NAME}"
    spec:
      ports:
        - name: web
          port: 80
          targetPort: ${{PORT}}
          protocol: TCP
      selector:
        app: "${APP_NAME}"
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: "${APP_NAME}"
      labels:
        app: "${APP_NAME}"
    spec:
      to:
        kind: Service
        name: "${APP_NAME}"
      port:
        targetPort: ${{PORT}}
parameters:
  - name: APP_NAME
    displayName: Application Name
    description: The name assigned to all application objects.
    value: pydantic-assistant
    required: true
  - name: IMAGE_NAME
    displayName: Container Image
    description: The Quay.io image repository to deploy.
    value: quay.io/kenghua_yeo/pydantic-assistant:latest
    required: true
  - name: PORT
    displayName: Container Port
    description: The internal port the container listens on.
    value: "8081"
    required: true
  - name: API_PROVIDER
    displayName: API Provider
    description: "LLM provider (e.g. anthropic, openai)."
    value: "anthropic"
    required: true
  - name: MODEL
    displayName: Model
    description: Model name to use for the assistant.
    value: "claude-opus-4-5"
    required: true
  - name: MAX_TURNS
    displayName: Max Turns
    description: Maximum number of conversation turns.
    value: "50"
    required: true
  - name: MAX_OUTPUT_TOKENS
    displayName: Max Output Tokens
    description: Maximum number of tokens in each model response.
    value: "16384"
    required: true
  - name: ALLOW_SHELL
    displayName: Allow Shell Commands
    description: "Whether to allow the agent to run shell commands (true/false)."
    value: "false"
    required: true
  - name: AGENT_STORAGE_SIZE
    displayName: Agent Volume Size
    description: Storage size for the agent configuration volume.
    value: "1Gi"
    required: true
  - name: INPUT_STORAGE_SIZE
    displayName: Input Volume Size
    description: Storage size for the input files volume.
    value: "5Gi"
    required: true
  - name: OUTPUT_STORAGE_SIZE
    displayName: Output Volume Size
    description: Storage size for the output files volume.
    value: "5Gi"
    required: true
