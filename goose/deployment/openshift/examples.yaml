# Additional OpenShift examples (Job, Secret template).
#
# For the primary oc rsh workflow, see README.md and use:
#   openshift/pvc.yaml
#   openshift/pod.yaml


---
# One-shot task — runs a goose recipe or command, then exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: goose-run
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: goose
          image: quay.io/kenghua_yeo/goose:latest
          args: ["run", "--help"]
          envFrom:
            - secretRef:
                name: goose-api-keys
          env:
            - name: GOOSE_PROVIDER
              value: openai
            - name: GOOSE_MODEL
              value: gpt-4o
            - name: GOOSE_DISABLE_KEYRING
              value: "1"
          volumeMounts:
            - name: goose-config
              mountPath: /home/goose/.config/goose
            - name: workspace
              mountPath: /home/goose/workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: goose-config
          persistentVolumeClaim:
            claimName: goose-config
        - name: workspace
          emptyDir: {}
