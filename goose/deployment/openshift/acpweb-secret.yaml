# OpenShift Secret for Goose ACP Web UI API keys.
#
# Create with oc (recommended — avoids storing keys in YAML files):
#
#   oc create secret generic goose-acpweb-api-keys \
#     --from-literal=GOOSE_PROVIDER=openai \
#     --from-literal=GOOSE_MODEL=gpt-4o \
#     --from-literal=OPENAI_API_KEY=sk-...
#
# Or for Anthropic:
#   oc create secret generic goose-acpweb-api-keys \
#     --from-literal=GOOSE_PROVIDER=anthropic \
#     --from-literal=GOOSE_MODEL=claude-sonnet-4-5 \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# ─────────────────────────────────────────────────────────────────────────────
# Only use this file if you need a declarative Secret (e.g. GitOps).
# DO NOT commit real keys to git. Use sealed-secrets, Vault, or oc create.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: goose-acpweb-api-keys
type: Opaque
stringData:
  GOOSE_PROVIDER: openai          # replace with your provider
  GOOSE_MODEL: gpt-4o             # replace with your model
  OPENAI_API_KEY: ""              # replace with your API key
  # ANTHROPIC_API_KEY: ""
  # GOOGLE_API_KEY: ""
