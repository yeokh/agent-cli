<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goose Chat</title>
<style>
/* ── Variables ───────────────────────────────────────────────────────────── */
:root {
  --bg:        #f6f8fa;
  --sidebar:   #ffffff;
  --card:      #eaeef2;
  --border:    #d0d7de;
  --text:      #1f2328;
  --muted:     #57606a;
  --accent:    #0969da;
  --accent-h:  #0550ae;
  --green:     #1a7f37;
  --amber:     #9a6700;
  --red:       #cf222e;
  --user-bg:   #0969da;
  --goose-bg:  #ffffff;
  --tool-bg:   #eafbee;
  --tool-brd:  #aaf0c4;
  --perm-bg:   #fffbeb;
  --perm-brd:  #fde68a;
  --side-w:    280px;
}
/* ── Reset ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 14px; line-height: 1.6;
  background: var(--bg); color: var(--text);
  display: flex;
}
button {
  cursor: pointer; font: inherit; border: none; border-radius: 6px;
  transition: opacity .15s;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button:hover:not(:disabled) { opacity: .85; }
input, textarea, select {
  font: inherit; background: var(--card); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  outline: none; transition: border-color .15s;
}
input:focus, textarea:focus { border-color: var(--accent); }
a { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar {
  width: var(--side-w); flex-shrink: 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
.meta { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.meta span { font-size: 11.5px; color: var(--muted); }
.meta .val { color: var(--accent); font-weight: 500; }
.status-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--muted);
  margin-right: 5px; vertical-align: middle;
}
.status-dot.alive  { background: var(--green); }
.status-dot.busy   { background: var(--amber); animation: pulse 1s infinite; }
.status-dot.dead   { background: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }

/* ── CWD section ─────────────────────────────────────────────────────────── */
.cwd-section {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cwd-section label { font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 5px; }
.cwd-row { display: flex; gap: 5px; }
.cwd-row input {
  flex: 1; padding: 5px 8px; font-size: 12px; min-width: 0;
}
.btn-sm {
  padding: 5px 10px; font-size: 12px; font-weight: 600;
  background: var(--accent); color: #ffffff;
}
.btn-icon {
  padding: 5px 8px; font-size: 13px;
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
}
.btn-danger-sm {
  padding: 3px 7px; font-size: 11px;
  background: transparent; color: var(--red);
  border: 1px solid var(--red); border-radius: 4px;
}
.btn-reconnect {
  width: 100%; margin-top: 6px; padding: 5px;
  font-size: 12px; background: var(--card);
  color: var(--amber); border: 1px solid var(--amber);
}

/* ── File browser ────────────────────────────────────────────────────────── */
.file-section {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  padding: 10px 14px 0;
}
.file-header {
  display: flex; align-items: center; gap: 5px; margin-bottom: 6px; flex-shrink: 0;
}
.file-header label { font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); flex: 1; }
.breadcrumb {
  font-size: 11px; color: var(--muted); flex-shrink: 0;
  padding: 2px 0 6px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.breadcrumb span { cursor: pointer; }
.breadcrumb span:hover { color: var(--accent); }
.file-list {
  flex: 1; overflow-y: auto; font-size: 12px;
}
.file-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 5px; border-radius: 5px; cursor: default;
}
.file-item:hover { background: var(--card); }
.file-icon { flex-shrink: 0; width: 16px; text-align: center; }
.file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-name.dir { color: var(--accent); cursor: pointer; }
.file-name.dir:hover { text-decoration: underline; }
.file-size { font-size: 10.5px; color: var(--muted); flex-shrink: 0; }
.file-actions { display: flex; gap: 4px; flex-shrink: 0; opacity: 0; }
.file-item:hover .file-actions { opacity: 1; }
.file-actions button {
  padding: 1px 5px; font-size: 10px; background: var(--card);
  color: var(--muted); border: 1px solid var(--border); border-radius: 3px;
}
.file-actions button:hover { color: var(--text); }
.file-actions .del:hover { color: var(--red); border-color: var(--red); }
.file-empty { color: var(--muted); font-size: 12px; padding: 8px 5px; }

/* ── Upload area ─────────────────────────────────────────────────────────── */
.upload-area {
  border: 1px dashed var(--border); border-radius: 7px;
  padding: 10px; text-align: center; font-size: 12px;
  color: var(--muted); cursor: pointer; margin: 8px 0;
  transition: border-color .2s, background .2s; flex-shrink: 0;
}
.upload-area.drag-over { border-color: var(--accent); background: rgba(9,105,218,.06); }
.upload-area:hover { border-color: var(--muted); }
.upload-link { color: var(--accent); cursor: pointer; }

/* ── Main panel ──────────────────────────────────────────────────────────── */
.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  position: relative;
}

/* ── Messages ────────────────────────────────────────────────────────────── */
.messages {
  flex: 1; overflow-y: auto; padding: 20px 24px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg { display: flex; flex-direction: column; max-width: 780px; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.goose { align-self: flex-start; align-items: flex-start; }
.msg.system { align-self: center; align-items: center; }

.msg-role {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px;
}
.msg.user .msg-role { color: var(--accent); }

.msg-bubble {
  padding: 10px 14px; border-radius: 10px;
  line-height: 1.65; white-space: pre-wrap; word-break: break-word;
}
.msg.user  .msg-bubble { background: var(--user-bg);  color: #ffffff; border-radius: 10px 10px 2px 10px; }
.msg.goose .msg-bubble { background: var(--goose-bg); color: var(--text); border-radius: 10px 10px 10px 2px; border: 1px solid var(--border); }
.msg.system .msg-bubble { background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }

/* Tool call inline */
.tool-card {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 7px;
  background: var(--tool-bg); border: 1px solid var(--tool-brd);
  font-size: 12px; color: #166534;
  margin: 2px 0; max-width: 620px;
}
.tool-card .tool-status { margin-left: auto; font-size: 11px; }
.tool-card.done  { opacity: .75; }
.tool-card.error { background: #fff0ee; border-color: #ffb8b0; color: var(--red); }

/* Permission card */
.perm-card {
  padding: 12px 16px; border-radius: 9px;
  background: var(--perm-bg); border: 1px solid var(--perm-brd);
  max-width: 580px;
}
.perm-card h4 { font-size: 13px; font-weight: 700; color: var(--amber); margin-bottom: 4px; }
.perm-card .perm-title { font-size: 13px; margin-bottom: 6px; }
.perm-card .perm-input {
  font-size: 11.5px; color: var(--muted); font-family: monospace;
  background: rgba(0,0,0,.05); padding: 5px 8px; border-radius: 5px;
  margin-bottom: 8px; white-space: pre-wrap; word-break: break-all;
  max-height: 80px; overflow-y: auto;
}
.perm-options { display: flex; flex-wrap: wrap; gap: 6px; }
.perm-options button {
  padding: 5px 12px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card); color: var(--text);
}
.perm-options button.allow   { border-color: var(--green); color: var(--green); }
.perm-options button.reject  { border-color: var(--red);   color: var(--red);   }
.perm-options button:hover:not(:disabled) { opacity: 1; filter: brightness(1.2); }
.perm-answered { font-size: 12px; color: var(--muted); font-style: italic; }

/* Typing indicator */
.typing { display: flex; align-items: center; gap: 4px; padding: 6px 14px; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
  animation: bounce .9s infinite;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }

/* ── Input bar ───────────────────────────────────────────────────────────── */
.input-bar {
  flex-shrink: 0; padding: 12px 24px 16px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  position: relative;
}
.input-bar textarea {
  flex: 1; resize: none; padding: 9px 12px;
  border-radius: 8px; min-height: 42px; max-height: 160px;
  font-size: 14px; line-height: 1.5;
  border: 1px solid var(--border);
}
.btn-send {
  padding: 9px 18px; font-size: 14px; font-weight: 600;
  background: var(--accent); color: #ffffff; flex-shrink: 0;
  align-self: flex-end;
}
.btn-cancel-inp {
  padding: 9px 14px; font-size: 13px;
  background: var(--card); color: var(--red);
  border: 1px solid var(--red); flex-shrink: 0;
  align-self: flex-end;
}

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 80px; right: 20px; z-index: 999;
  padding: 9px 16px; border-radius: 8px; font-size: 13px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.err  { border-color: var(--red); color: var(--red); }

/* ── Slash command autocomplete ──────────────────────────────────────────── */
.slash-menu {
  position: absolute; bottom: calc(100% + 4px); left: 24px; right: 24px;
  background: var(--sidebar); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  z-index: 100; overflow: hidden; max-height: 220px; overflow-y: auto;
}
.slash-item {
  display: flex; align-items: baseline; gap: 10px;
  padding: 7px 12px; cursor: pointer; font-size: 13px;
}
.slash-item:hover, .slash-item.active { background: var(--card); }
.slash-name  { font-weight: 600; color: var(--accent); flex-shrink: 0; }
.slash-desc  { color: var(--muted); font-size: 12px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
.slash-hint  { margin-left: auto; font-size: 11px; color: var(--border);
               flex-shrink: 0; font-style: italic; }
</style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>🪿 Goose Chat</h1>
    <div class="meta">
      <span><span class="status-dot" id="dot"></span><span id="meta-status">Starting…</span></span>
      <span>Provider: <span class="val" id="meta-provider">—</span></span>
      <span>Model: <span class="val" id="meta-model">—</span></span>
      <span>Mode: <span class="val" id="meta-mode">—</span></span>
      <span>Session: <span class="val" id="meta-session">—</span></span>
    </div>
    <button class="btn-reconnect" id="btn-reconnect" onclick="reconnect()">↺ Reconnect</button>
  </div>

  <div class="cwd-section">
    <label>Working Folder</label>
    <div class="cwd-row">
      <input type="text" id="cwd-input" placeholder="/path/to/folder">
      <button class="btn-sm" onclick="setCwd()">Set</button>
      <button class="btn-icon" onclick="refreshFiles()" title="Refresh">↻</button>
    </div>
  </div>

  <div class="file-section">
    <div class="file-header">
      <label>Files</label>
      <button class="btn-icon" onclick="showMkdir()" title="New folder">📁+</button>
    </div>
    <div class="breadcrumb" id="breadcrumb">
      <span onclick="navTo('')">~</span>
    </div>
    <div class="file-list" id="file-list">
      <div class="file-empty">Loading…</div>
    </div>
    <div class="upload-area" id="upload-area"
         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)"
         onclick="document.getElementById('file-input').click()">
      ↑ Drop files here or <span class="upload-link">browse</span>
      <input type="file" id="file-input" multiple hidden onchange="uploadFiles(this.files)">
    </div>
  </div>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<main class="main">
  <div class="messages" id="messages">
    <div class="msg system">
      <div class="msg-bubble">Connecting to Goose…</div>
    </div>
  </div>

  <div class="input-bar" id="input-bar">
    <textarea id="input" placeholder="Type a message… (/ for commands, Enter to send)"
              rows="1" oninput="onInputChange(event)"
              onkeydown="onKey(event)"></textarea>
    <button class="btn-send" id="btn-send" onclick="sendMessage()">Send</button>
    <button class="btn-cancel-inp" id="btn-cancel" onclick="cancelPrompt()" style="display:none">Cancel</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ── State ─────────────────────────────────────────────────────────────── */
const S = {
  cwd:         "",
  filePath:    "",   // current folder shown in file browser (relative to cwd)
  busy:        false,
  currentMsgEl: null,   // <div> for the streaming goose message
  activeTools: {},       // id → { el, titleEl }
  pendingPerms: {},      // req_id → card element
};

/* ── Helpers ───────────────────────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }

function toast(msg, isErr = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', isErr ? 5000 : 2500);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function fmtSize(n) {
  const u = ['B','KB','MB','GB'];
  let i = 0;
  while (n >= 1024 && i < 3) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
}

function scrollToBottom() {
  const el = $('messages');
  el.scrollTop = el.scrollHeight;
}

/* ── Status polling ────────────────────────────────────────────────────── */
async function pollStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    applyStatus(d);
  } catch(e) {}
}

function applyStatus(d) {
  $('meta-provider').textContent = d.provider || '—';
  $('meta-model').textContent    = d.model    || '—';
  $('meta-mode').textContent     = d.mode     || '—';
  $('meta-session').textContent  = d.session_id ? d.session_id.slice(0, 8) + '…' : '—';
  $('cwd-input').value           = d.cwd || '';
  S.cwd = d.cwd || '';

  const dot = $('dot');
  const st  = $('meta-status');
  if (!d.alive) {
    dot.className = 'status-dot dead';
    st.textContent = d.error ? 'Error' : 'Offline';
  } else if (d.busy) {
    dot.className = 'status-dot busy';
    st.textContent = 'Thinking…';
  } else {
    dot.className = 'status-dot alive';
    st.textContent = 'Ready';
  }

  $('btn-send').disabled   = d.busy || !d.alive;
  $('input').disabled      = d.busy || !d.alive;
  $('btn-cancel').style.display = d.busy ? 'block' : 'none';

  S.busy = d.busy;

  if (!d.alive) {
    $('btn-reconnect').style.display = 'block';
  } else {
    $('btn-reconnect').style.display = 'none';
  }
}

/* ── Chat rendering ────────────────────────────────────────────────────── */
function addMsg(role, html, cls = '') {
  const msgs = $('messages');

  // Remove typing indicator if present
  const typing = msgs.querySelector('.typing-wrap');
  if (typing) typing.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = role === 'user' ? 'You' : role === 'goose' ? 'Goose' : '';
  if (role !== 'system') wrap.appendChild(roleEl);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble ' + cls;
  bubble.innerHTML = html;
  wrap.appendChild(bubble);

  msgs.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

function addTyping() {
  const msgs = $('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg goose typing-wrap';
  wrap.innerHTML = `
    <div class="msg-role">Goose</div>
    <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(wrap);
  scrollToBottom();
}

function startGooseMsg() {
  const msgs = $('messages');
  const typing = msgs.querySelector('.typing-wrap');
  if (typing) typing.remove();

  const wrap = document.createElement('div');
  wrap.className = 'msg goose';

  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = 'Goose';
  wrap.appendChild(roleEl);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.style.whiteSpace = 'pre-wrap';
  wrap.appendChild(bubble);

  msgs.appendChild(wrap);
  S.currentMsgEl = bubble;
  scrollToBottom();
  return bubble;
}

function appendChunk(text) {
  if (!S.currentMsgEl) startGooseMsg();
  S.currentMsgEl.textContent += text;
  scrollToBottom();
}

function addToolCard(id, title) {
  const msgs = $('messages');
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `<span>⚙</span><span class="tool-title">${escHtml(title)}</span>
    <span class="tool-status">pending…</span>`;
  msgs.appendChild(card);
  S.activeTools[id] = { el: card, statusEl: card.querySelector('.tool-status') };
  scrollToBottom();
  return card;
}

function updateToolCard(id, status) {
  const t = S.activeTools[id];
  if (!t) return;
  if (status === 'success') {
    t.statusEl.textContent = '✓ done';
    t.el.classList.add('done');
  } else if (status === 'failed') {
    t.statusEl.textContent = '✗ failed';
    t.el.classList.add('error');
  }
}

function addPermCard(evt) {
  const msgs = $('messages');
  const card = document.createElement('div');
  card.className = 'perm-card';

  const kindClass = (opt) => {
    const id = (opt.optionId || opt.id || '').toLowerCase();
    if (id.includes('allow')) return 'allow';
    if (id.includes('reject')) return 'reject';
    return '';
  };

  // req_id is a UUID string — must be quoted in the onclick attribute
  const rid = String(evt.req_id);
  const btns = evt.options.map(opt => {
    const oid = escHtml(opt.optionId || opt.id || 'allow_once');
    return `<button class="${kindClass(opt)}" onclick="answerPerm('${rid}', '${oid}')"
     >${escHtml(opt.name || opt.optionId)}</button>`;
  }).join('');

  const rawHtml = evt.rawInput
    ? `<div class="perm-input">${escHtml(evt.rawInput)}</div>` : '';

  card.innerHTML = `
    <h4>⚠ Permission Required</h4>
    <div class="perm-title">${escHtml(evt.title)}</div>
    ${rawHtml}
    <div class="perm-options">${btns}</div>`;

  msgs.appendChild(card);
  S.pendingPerms[evt.req_id] = card;
  scrollToBottom();
}

async function answerPerm(reqId, optionId) {
  const cardEl = S.pendingPerms[reqId];
  if (!cardEl) return;
  // Disable all buttons immediately for visual feedback
  cardEl.querySelectorAll('button').forEach(b => b.disabled = true);
  cardEl.querySelector('.perm-options').innerHTML =
    `<span class="perm-answered">✓ Responded: ${escHtml(optionId)}</span>`;
  delete S.pendingPerms[reqId];

  try {
    await fetch('/api/permission', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({option_id: optionId}),
    });
  } catch(e) {
    toast('Failed to send permission response', true);
  }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ── Send / stream ─────────────────────────────────────────────────────── */
async function sendMessage() {
  const inp = $('input');
  const text = inp.value.trim();
  if (!text || S.busy) return;

  hideSlashMenu();

  // Intercept /mode <name> — use session/set_mode RPC instead of prompting the LLM
  const modeMatch = text.match(/^\/mode\s+(\S+)$/i);
  if (modeMatch) {
    inp.value = '';
    inp.style.height = 'auto';
    addMsg('user', escHtml(text));
    try {
      const r = await fetch('/api/setmode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: modeMatch[1]}),
      });
      const d = await r.json();
      if (d.error) {
        addMsg('system', `⚠ Mode change failed: ${escHtml(d.error)}`);
      } else {
        $('meta-mode').textContent = d.mode;
        addMsg('system', `Mode changed to <strong>${escHtml(d.mode)}</strong>`);
      }
    } catch(e) { addMsg('system', '⚠ Mode change failed'); }
    return;
  }

  inp.value = '';
  inp.style.height = 'auto';

  // Add user bubble
  addMsg('user', escHtml(text));
  addTyping();

  S.currentMsgEl = null;
  S.activeTools  = {};

  $('btn-send').disabled = true;
  $('input').disabled    = true;
  $('btn-cancel').style.display = 'block';
  $('dot').className     = 'status-dot busy';
  $('meta-status').textContent = 'Thinking…';
  S.busy = true;

  try {
    const resp = await fetch('/api/chat', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({message: text}),
    });

    const reader = resp.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }
        handleSseEvent(evt);
      }
    }
  } catch(e) {
    appendChunk('\n[Connection error]');
  }

  // Finalise
  S.currentMsgEl = null;
  S.busy = false;
  $('btn-send').disabled = false;
  $('input').disabled    = false;
  $('input').focus();
  $('btn-cancel').style.display = 'none';
  $('dot').className     = 'status-dot alive';
  $('meta-status').textContent = 'Ready';
  refreshFiles();
}

function handleSseEvent(evt) {
  switch (evt.type) {
    case 'chunk':
      appendChunk(evt.text);
      break;
    case 'tool':
      addToolCard(evt.id, evt.title);
      break;
    case 'tool_done':
      updateToolCard(evt.id, evt.status);
      break;
    case 'permission':
      // Remove typing indicator first
      const typing = $('messages').querySelector('.typing-wrap');
      if (typing) typing.remove();
      addPermCard(evt);
      break;
    case 'error':
      const typing2 = $('messages').querySelector('.typing-wrap');
      if (typing2) typing2.remove();
      addMsg('system', `⚠ ${escHtml(evt.message)}`);
      break;
    case 'done':
      const typing3 = $('messages').querySelector('.typing-wrap');
      if (typing3) typing3.remove();
      break;
    case 'mode_change':
      $('meta-mode').textContent = evt.mode || '—';
      addMsg('system', `Mode changed to <strong>${escHtml(evt.mode)}</strong>`);
      break;
    case 'commands':
      updateSlashCommands(evt.commands);
      break;
    case 'ping':
      break;
  }
}

async function cancelPrompt() {
  await fetch('/api/cancel', {method: 'POST'});
  toast('Cancel sent');
}

/* ── CWD / Reconnect ───────────────────────────────────────────────────── */
async function setCwd() {
  const cwd = $('cwd-input').value.trim();
  if (!cwd) return;
  const btn = document.querySelector('.cwd-row .btn-sm');
  btn.disabled = true;
  btn.textContent = '…';
  toast('Starting new session…');
  try {
    const r = await fetch('/api/cwd', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cwd}),
    });
    const d = await r.json();
    if (d.error) { toast(d.error, true); return; }
    applyStatus(d);
    S.filePath = '';
    refreshFiles();
    $('messages').innerHTML = '';
    addMsg('system', `Working folder: <code>${escHtml(d.cwd)}</code> — new session started.`);
    toast('Session ready');
  } catch(e) {
    toast('Failed to change folder', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Set';
  }
}

async function reconnect() {
  toast('Reconnecting…');
  try {
    const r = await fetch('/api/reconnect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cwd: S.cwd}),
    });
    const d = await r.json();
    if (d.error) { toast(d.error, true); return; }
    applyStatus(d);
    toast('Reconnected');
    $('messages').innerHTML = '';
    addMsg('system', 'Reconnected. New session started.');
  } catch(e) { toast('Reconnect failed', true); }
}

/* ── File browser ──────────────────────────────────────────────────────── */
async function refreshFiles() {
  const list = $('file-list');
  try {
    const r = await fetch('/api/files?path=' + encodeURIComponent(S.filePath));
    const d = await r.json();
    renderFiles(d.files, d.path);
    renderBreadcrumb(d.cwd, d.path);
  } catch(e) {
    list.innerHTML = '<div class="file-empty">Error loading files</div>';
  }
}

function renderBreadcrumb(cwd, relPath) {
  const crumb = $('breadcrumb');
  const parts = relPath ? relPath.split('/').filter(Boolean) : [];
  let html = `<span onclick="navTo('')">~</span>`;
  let acc  = '';
  for (const part of parts) {
    acc += (acc ? '/' : '') + part;
    const p = acc;
    html += ` / <span onclick="navTo('${escHtml(p)}')">${escHtml(part)}</span>`;
  }
  crumb.innerHTML = html;
}

function renderFiles(files, relPath) {
  const list = $('file-list');
  if (!files || files.length === 0) {
    list.innerHTML = '<div class="file-empty">Empty folder</div>';
    return;
  }

  // "Go up" entry if inside a subfolder
  let html = '';
  if (relPath) {
    const up = relPath.includes('/') ? relPath.split('/').slice(0,-1).join('/') : '';
    html += `<div class="file-item" ondblclick="navTo('${escHtml(up)}')">
      <span class="file-icon">⬆</span>
      <span class="file-name dir" onclick="navTo('${escHtml(up)}')">.. (up)</span>
    </div>`;
  }

  for (const f of files) {
    const icon  = f.is_dir ? '📁' : '📄';
    const size  = f.is_dir ? '' : `<span class="file-size">${fmtSize(f.size)}</span>`;
    const nameClass = 'file-name' + (f.is_dir ? ' dir' : '');
    const nameClick = f.is_dir ? `onclick="navTo('${escHtml(f.path)}')"` : '';
    const actions = f.is_dir ? `
      <div class="file-actions">
        <button class="del" onclick="deleteFile('${escHtml(f.path)}', true)" title="Delete folder">✕</button>
      </div>` : `
      <div class="file-actions">
        <button onclick="downloadFile('${escHtml(f.path)}')" title="Download">↓</button>
        <button class="del" onclick="deleteFile('${escHtml(f.path)}', false)" title="Delete">✕</button>
      </div>`;
    html += `<div class="file-item">
      <span class="file-icon">${icon}</span>
      <span class="${nameClass}" ${nameClick}>${escHtml(f.name)}</span>
      ${size}
      ${actions}
    </div>`;
  }
  list.innerHTML = html;
}

function navTo(path) {
  S.filePath = path;
  refreshFiles();
}

function downloadFile(path) {
  window.location = '/api/download?path=' + encodeURIComponent(path);
}

async function deleteFile(path, isDir) {
  const kind = isDir ? 'folder' : 'file';
  if (!confirm(`Delete ${kind} "${path}"?`)) return;
  try {
    const r = await fetch('/api/delete', {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });
    const d = await r.json();
    if (d.error) { toast(d.error, true); return; }
    toast(`Deleted ${path}`);
    refreshFiles();
  } catch(e) { toast('Delete failed', true); }
}

function showMkdir() {
  const name = prompt('New folder name:');
  if (!name) return;
  fetch('/api/mkdir', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({parent: S.filePath, name}),
  }).then(r => r.json()).then(d => {
    if (d.error) { toast(d.error, true); return; }
    refreshFiles();
  });
}

/* ── Upload ────────────────────────────────────────────────────────────── */
function onDragOver(e) {
  e.preventDefault();
  $('upload-area').classList.add('drag-over');
}
function onDragLeave(e) {
  $('upload-area').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  $('upload-area').classList.remove('drag-over');
  uploadFiles(e.dataTransfer.files);
}

async function uploadFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  const fd = new FormData();
  fd.append('path', S.filePath);
  for (const f of fileList) fd.append('files', f);
  try {
    const r = await fetch('/api/upload', {method: 'POST', body: fd});
    const d = await r.json();
    if (d.uploaded.length) toast(`Uploaded: ${d.uploaded.join(', ')}`);
    if (d.errors.length)   toast(`Failed: ${d.errors.join(', ')}`, true);
    refreshFiles();
  } catch(e) { toast('Upload failed', true); }
  // Reset file input
  $('file-input').value = '';
}

/* ── Slash command autocomplete ────────────────────────────────────────── */
let slashCommands = [];   // populated by available_commands SSE
let slashMenuIdx  = -1;

function updateSlashCommands(cmds) {
  slashCommands = cmds || [];
}

function getSlashMenu() { return document.getElementById('slash-menu'); }

function showSlashMenu(filter) {
  let menu = getSlashMenu();
  if (!menu) {
    menu = document.createElement('div');
    menu.id = 'slash-menu';
    menu.className = 'slash-menu';
    $('input-bar').appendChild(menu);
  }

  const matches = filter === '/'
    ? slashCommands
    : slashCommands.filter(c =>
        c.name.toLowerCase().startsWith(filter.toLowerCase())
      );

  if (matches.length === 0) { hideSlashMenu(); return; }

  slashMenuIdx = -1;
  menu.innerHTML = matches.map((c, i) => `
    <div class="slash-item" data-idx="${i}" data-name="${escHtml(c.name)}"
         onmousedown="pickSlash(event, '${escHtml(c.name)}', '${escHtml(c.inputHint)}')">
      <span class="slash-name">${escHtml(c.name)}</span>
      <span class="slash-desc">${escHtml(c.description)}</span>
      ${c.inputHint ? `<span class="slash-hint">${escHtml(c.inputHint)}</span>` : ''}
    </div>`).join('');
  menu.style.display = 'block';
}

function hideSlashMenu() {
  const menu = getSlashMenu();
  if (menu) menu.style.display = 'none';
  slashMenuIdx = -1;
}

function pickSlash(e, name, hint) {
  e.preventDefault();
  const inp = $('input');
  inp.value = name + (hint ? ' ' : '');
  inp.focus();
  hideSlashMenu();
}

function navigateSlashMenu(dir) {
  const menu = getSlashMenu();
  if (!menu || menu.style.display === 'none') return false;
  const items = menu.querySelectorAll('.slash-item');
  if (!items.length) return false;
  items[slashMenuIdx >= 0 ? slashMenuIdx : 0]?.classList.remove('active');
  slashMenuIdx = (slashMenuIdx + dir + items.length) % items.length;
  items[slashMenuIdx].classList.add('active');
  return true;
}

function onKey(e) {
  const menu = getSlashMenu();
  const menuOpen = menu && menu.style.display !== 'none';

  if (menuOpen) {
    if (e.key === 'ArrowDown')  { e.preventDefault(); navigateSlashMenu(1);  return; }
    if (e.key === 'ArrowUp')    { e.preventDefault(); navigateSlashMenu(-1); return; }
    if (e.key === 'Escape')     { hideSlashMenu(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && slashMenuIdx >= 0)) {
      e.preventDefault();
      const active = menu.querySelector('.slash-item.active') || menu.querySelector('.slash-item');
      if (active) active.dispatchEvent(new MouseEvent('mousedown', {bubbles: true}));
      return;
    }
  }

  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function onInputChange(e) {
  autoResize(e.target);
  const val = e.target.value;
  if (val.startsWith('/') && slashCommands.length > 0) {
    const token = val.split(' ')[0];
    showSlashMenu(token);
  } else {
    hideSlashMenu();
  }
}

/* ── Init ──────────────────────────────────────────────────────────────── */
async function init() {
  await pollStatus();
  refreshFiles();

  // Load available slash commands from server
  fetch('/api/commands').then(r => r.json()).then(d => {
    if (d.commands) updateSlashCommands(d.commands);
  }).catch(() => {});

  const d = await fetch('/api/status').then(r => r.json());
  $('messages').innerHTML = '';
  if (d.alive) {
    addMsg('system', `Connected to Goose (${escHtml(d.provider)} / ${escHtml(d.model)}). Session <code>${escHtml(d.session_id || '')}</code>`);
  } else {
    addMsg('system', d.error || 'Goose session not ready. Click Reconnect.');
  }

  // Poll status every 3s to keep dot in sync
  setInterval(pollStatus, 3000);
}

init();
