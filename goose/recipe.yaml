version: 1.0.0
title: Models Endpoint Helper
description: A reusable assistant workflow for clarifying and handling a user’s request related to a `/models` path. It helps interpret what the user wants and guides next steps for retrieving, listing, or using model information.
instructions: |-
  Confirm the user’s intent for the `/models` request (e.g., whether they want available models, metadata, configuration, or guidance on how to use models). Ask any key missing details such as environment, desired output format, constraints (e.g., filtering/selection), and whether they want a list, a comparison, or specific model guidance.

  Then provide the requested result or a structured plan to obtain it. If an output format is explicitly requested, follow that format exactly (e.g., valid JSON) and ensure the response keys/fields match the requested schema. If non-standard tools or systems are required for the task, call them out explicitly as part of the instructions.
extensions:
- type: platform
  name: Extension Manager
  description: Enable extension management tools for discovering, enabling, and disabling extensions
  display_name: Extension Manager
  bundled: true
  available_tools: []
