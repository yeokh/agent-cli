---
- name: Install IIS and deploy corporate website placeholder
  hosts: "{{ target_hosts | default('win-web-01,win-web-02') }}"
  gather_facts: no
  vars:
    iis_features:
      - Web-Server
      - Web-Static-Content
      - Web-Default-Doc
      - Web-Http-Logging
      - Web-Request-Monitor
      - Web-Filtering
      - Web-Stat-Compression
    site_path: 'C:\inetpub\sites\corpsite'
    site_name: 'CorpSite'
    app_pool_name: 'CorpSitePool'
    host_header: 'corpsite.example.com'

  tasks:
    - name: Install IIS Web Server role and required features
      win_feature:
        name: "{{ item }}"
        state: present
        include_sub_features: yes
        include_management_tools: no
      loop: "{{ iis_features }}"
      register: iis_install

    - name: Reboot if IIS features were installed
      win_reboot:
        post_reboot_delay: 10
      when: iis_install.changed

    - name: Start W3SVC and set to auto-start
      win_service:
        name: W3SVC
        state: started
        start_mode: auto

    - name: Create website content folder
      win_file:
        path: "{{ site_path }}"
        state: directory

    - name: Create placeholder index.html
      win_copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Corporate Portal</title>
          </head>
          <body>
              <h1>Site coming soon.</h1>
          </body>
          </html>
        dest: "{{ site_path }}\\index.html"

    - name: Create application pool
      win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: present
        attributes:
          managedRuntimeVersion: ''
          managedPipelineMode: 'Integrated'

    - name: Stop Default Web Site to avoid port 80 conflict
      win_iis_website:
        name: 'Default Web Site'
        state: stopped

    - name: Create IIS website
      win_iis_website:
        name: "{{ site_name }}"
        state: present
        physical_path: "{{ site_path }}"
        application_pool: "{{ app_pool_name }}"
        bindings:
          - protocol: http
            ip: '*'
            port: 80
            hostname: "{{ host_header }}"

    - name: Ensure website is started
      win_iis_website:
        name: "{{ site_name }}"
        state: started

    - name: Add Windows Firewall inbound rule for HTTP port 80
      win_firewall_rule:
        name: 'Allow HTTP port 80'
        description: 'Allow inbound HTTP traffic on port 80'
        direction: in
        action: allow
        protocol: tcp
        local_port: 80
        state: present
        enabled: yes

    - name: Verify IIS website is accessible
      win_uri:
        url: "http://localhost"
        follow_redirects: none
      register: iis_check
      failed_when: false

    - name: Report completion status
      debug:
        msg:
          - "IIS installation and configuration complete on {{ inventory_hostname }}"
          - "Website name: {{ site_name }}"
          - "Content path: {{ site_path }}"
          - "Host header: {{ host_header }}"
          - "Application pool: {{ app_pool_name }}"
          - "HTTP status code: {{ iis_check.status_code | default('N/A') }}"
