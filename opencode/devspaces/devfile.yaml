schemaVersion: 2.2.2
metadata:
  name: opencode-agent
  displayName: OpenCode AI Agent
  description: >
    OpenCode AI coding agent running on OpenShift DevSpaces.
    Built on the UDI ubi9 base with opencode installed via its official
    install script. Provider and API keys are injected at runtime via
    environment variables or an OpenShift Secret — nothing is baked into
    the image.
  tags:
    - AI
    - Agent
    - OpenCode

# ─────────────────────────────────────────────────────────────────────────────
# Before opening this workspace:
#
#   1. Build and push the custom image (once, and whenever you upgrade opencode):
#        podman build \
#          -t quay.io/<your-org>/opencode-devspaces:latest \
#          -f opencode/devspaces/Containerfile-devspaces \
#          opencode/devspaces/
#        podman push quay.io/<your-org>/opencode-devspaces:latest
#
#   2. Replace the image reference below with your quay.io repo.
#
#   3. Supply API keys via an OpenShift Secret in the DevSpaces namespace:
#        oc create secret generic opencode-api-keys \
#          --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#      Then uncomment the secretKeyRef env blocks in the container below.
#
#   4. Open the workspace via the DevSpaces dashboard or:
#        https://<devspaces-host>/dashboard/#/load-factory?url=<repo-url>
# ─────────────────────────────────────────────────────────────────────────────

components:
  - name: opencode
    container:
      # Replace with your image after building from Containerfile-devspaces
      image: quay.io/kenghua_yeo/opencode-devspaces:latest
      memoryLimit: 2Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      volumeMounts:
        - name: opencode-config
          path: /home/user/.config/opencode
        - name: opencode-data
          # Mounted at the whole .local tree (not just .local/share/opencode)
          # so XDG_STATE_HOME (~/.local/state), XDG_CACHE_HOME (~/.local/cache)
          # and XDG_DATA_HOME (~/.local/share) all land on the PVC-backed,
          # group-writable mount. Without this, opencode fails on first run
          # with: EACCES: permission denied, mkdir '/home/user/.local/state'
          # because that path isn't covered by any volume and is left on the
          # container's ephemeral, possibly non-group-writable filesystem.
          path: /home/user/.local
      env:
        - name: OPENCODE_DISABLE_AUTOUPDATE
          value: "true"
        # ── Provider / model ──────────────────────────────────────────────────
        # Option A: hard-code for development (not recommended for production)
        # - name: ANTHROPIC_API_KEY
        #   value: sk-ant-...
        #
        # Option B (recommended): source from an OpenShift Secret
        #   oc create secret generic opencode-api-keys \
        #     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
        # - name: ANTHROPIC_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: opencode-api-keys
        #       key: ANTHROPIC_API_KEY
        # - name: OPENAI_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: opencode-api-keys
        #       key: OPENAI_API_KEY

  # Persistent volume: survives workspace restarts and image rebuilds.
  # Stores opencode.json, tui.json, agents/, commands/, plugins/.
  - name: opencode-config
    volume:
      size: 1Gi

  # Persistent volume: survives workspace restarts and image rebuilds.
  # Mounted over the whole /home/user/.local tree: stores auth.json (provider
  # credentials), the session DB, snapshots, logs (.local/share/opencode) as
  # well as XDG_STATE_HOME (.local/state) and XDG_CACHE_HOME (.local/cache).
  - name: opencode-data
    volume:
      size: 1Gi

commands:
  # ── First-time setup ───────────────────────────────────────────────────────
  - id: opencode-login
    exec:
      label: "1. Log in to a provider (first-time API key setup)"
      component: opencode
      workingDir: ${PROJECT_SOURCE}
      commandLine: "opencode auth login"
      group:
        kind: build
        isDefault: false

  # ── Daily use ──────────────────────────────────────────────────────────────
  - id: opencode-tui
    exec:
      label: "2. Start OpenCode TUI"
      component: opencode
      workingDir: ${PROJECT_SOURCE}
      commandLine: "opencode"
      group:
        kind: run
        isDefault: true

  - id: opencode-auth-list
    exec:
      label: "OpenCode Auth List (verify configured providers)"
      component: opencode
      workingDir: ${PROJECT_SOURCE}
      commandLine: "opencode auth list"
      group:
        kind: run
        isDefault: false
