# Gogs Secret — admin credentials.
#
# Create with oc (recommended — keeps credentials out of YAML files):
#
#   oc create secret generic gogs-secret \
#     --from-literal=GOGS_ADMIN_USER=admin \
#     --from-literal=GOGS_ADMIN_PASSWORD=changeme \
#     --from-literal=GOGS_ADMIN_EMAIL=admin@example.com
#
# ─────────────────────────────────────────────────────────────────────────────
# Only use this file for declarative / GitOps deployments.
# DO NOT commit real passwords to git. Use Sealed Secrets, Vault, or oc create.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: gogs-secret
  labels:
    app: gogs
type: Opaque
stringData:
  # Admin account created automatically on first start when password is set.
  # Leave GOGS_ADMIN_PASSWORD empty to use the interactive web installer.
  GOGS_ADMIN_USER:     "gogs"
  GOGS_ADMIN_PASSWORD: ""
  GOGS_ADMIN_EMAIL:    "gogs@localhost"
