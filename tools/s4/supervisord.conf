; supervisord.conf — process manager for S4
;
; Manages two long-running processes:
;   [program:rgw]    Ceph RADOS Gateway — S3 API on port 7480
;   [program:nodejs] Node.js web server  — management UI on port 5000
;
; rgw is given a higher priority (lower number) so it starts first;
; nodejs waits 10 seconds for the S3 API to be ready before starting.

[supervisord]
nodaemon  = true
logfile   = /var/log/supervisord.log
pidfile   = /var/run/supervisord.pid
loglevel  = info

[program:rgw]
command = /usr/bin/radosgw \
    --cluster ceph \
    --default-log-to-stderr=true \
    --err-to-stderr=true \
    --default-log-to-file=false \
    --foreground \
    -n client.rgw \
    --no-mon-config
priority     = 10
autostart    = true
autorestart  = true
startsecs    = 5
startretries = 3
stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nodejs]
command   = node /opt/app-root/bin/s4/backend/dist/server.js
directory = /opt/app-root/bin/s4/backend
priority     = 20
autostart    = true
autorestart  = true
startsecs    = 10
startretries = 3
stdout_logfile         = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile         = /dev/stderr
stderr_logfile_maxbytes = 0
environment =
    NODE_ENV="production",
    AWS_S3_ENDPOINT="%(ENV_AWS_S3_ENDPOINT)s",
    AWS_ACCESS_KEY_ID="%(ENV_AWS_ACCESS_KEY_ID)s",
    AWS_SECRET_ACCESS_KEY="%(ENV_AWS_SECRET_ACCESS_KEY)s",
    AWS_DEFAULT_REGION="%(ENV_AWS_DEFAULT_REGION)s",
    PORT="%(ENV_PORT)s",
    IP="%(ENV_IP)s",
    UI_USERNAME="%(ENV_UI_USERNAME)s",
    UI_PASSWORD="%(ENV_UI_PASSWORD)s",
    JWT_SECRET="%(ENV_JWT_SECRET)s",
    JWT_EXPIRATION_HOURS="%(ENV_JWT_EXPIRATION_HOURS)s",
    COOKIE_REQUIRE_HTTPS="%(ENV_COOKIE_REQUIRE_HTTPS)s",
    LOCAL_STORAGE_PATHS="%(ENV_LOCAL_STORAGE_PATHS)s",
    MAX_FILE_SIZE_GB="%(ENV_MAX_FILE_SIZE_GB)s",
    MAX_CONCURRENT_TRANSFERS="%(ENV_MAX_CONCURRENT_TRANSFERS)s"
