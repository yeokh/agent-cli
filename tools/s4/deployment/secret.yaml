# S4 Secret — S3 credentials and optional UI authentication.
#
# Create with oc (recommended — keeps credentials out of YAML files):
#
#   oc create secret generic s4-secret \
#     --from-literal=AWS_ACCESS_KEY_ID=s4admin \
#     --from-literal=AWS_SECRET_ACCESS_KEY=changeme \
#     --from-literal=UI_USERNAME=admin \
#     --from-literal=UI_PASSWORD=changeme
#
# ─────────────────────────────────────────────────────────────────────────────
# Only use this file for declarative / GitOps deployments.
# DO NOT commit real passwords to git. Use Sealed Secrets, Vault, or oc create.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: s4-secret
  labels:
    app: s4
type: Opaque
stringData:
  # S3 API credentials — used by radosgw-admin to create the RGW user
  # and exposed to clients for bucket operations.
  AWS_ACCESS_KEY_ID:     "s4admin"
  AWS_SECRET_ACCESS_KEY: ""

  # Web UI authentication (leave both empty to disable login prompt)
  UI_USERNAME: ""
  UI_PASSWORD: ""

  # JWT secret for session tokens (auto-generated by Node.js if left empty)
  JWT_SECRET: ""
