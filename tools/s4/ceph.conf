# Ceph RGW configuration for S4
#
# Uses the POSIX filesystem filter (rgw filter = posix) backed by the SQLite
# dbstore metadata backend — no Ceph cluster or monitors required.
#
# All data lives under /var/lib/ceph/radosgw/:
#   buckets/  — object data stored as regular files
#   db/       — SQLite databases (metadata, users, buckets)
#   tmp/      — temporary upload/transfer staging area
#
# The [client] section is intentional: radosgw reads its config from the
# [client] global section when no [client.rgw] section is present and
# --no-mon-config is passed (see supervisord.conf).

[client]
rgw backend store = dbstore
rgw config store  = dbstore
rgw filter        = posix

rgw_posix_base_path      = /var/lib/ceph/radosgw/buckets
rgw_posix_database_root  = /var/lib/ceph/radosgw/db
rgw_posix_tmp_path       = /var/lib/ceph/radosgw/tmp

admin socket = /var/lib/ceph/radosgw/ceph-$cluster-$name.asok

rgw_enable_apis    = s3, s3website, sts, sns, notifications
rgw_enable_usage_log = false
rgw_enable_ops_log   = false
