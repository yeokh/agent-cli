# devpi Secret — admin credentials and optional configuration overrides.
#
# Create with oc (recommended — keeps credentials out of YAML files):
#
#   oc create secret generic devpi-secret \
#     --from-literal=DEVPI_PASSWORD=changeme
#
# ─────────────────────────────────────────────────────────────────────────────
# Only use this file for declarative / GitOps deployments.
# DO NOT commit real passwords to git. Use Sealed Secrets, Vault, or oc create.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: devpi-secret
  labels:
    app: devpi
type: Opaque
stringData:
  # devpi admin password (leave empty for no password — not recommended in prod)
  DEVPI_PASSWORD: ""
