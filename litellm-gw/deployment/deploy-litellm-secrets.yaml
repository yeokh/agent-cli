---
# ──────────────────────────────────────────────────────────────────────────────
# LiteLLM Gateway — OpenShift Secret
#
# Replace all placeholder values before applying:
#   oc apply -f deploy-litellm-secrets.yaml -n litellm-gw
#
# Never commit this file with real keys. Keep deploy-litellm-secrets.yaml
# in .gitignore or use 'oc create secret' / Vault / Sealed Secrets instead.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secret
  namespace: litellm-gw
  labels:
    app: litellm-gw
type: Opaque
stringData:
  # LiteLLM admin master key — clients must present this as Bearer token
  LITELLM_MASTER_KEY: "REPLACE_WITH_MASTER_KEY"

  # Cloud provider API keys
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
  ANTHROPIC_API_KEY: "REPLACE_WITH_ANTHROPIC_API_KEY"
  OPENROUTER_API_KEY: "REPLACE_WITH_OPENROUTER_API_KEY"

  # Red Hat MaaS
  REDHAT_API_KEY: "REPLACE_WITH_REDHAT_API_KEY"

  # vLLM — update if your vLLM service has a different in-cluster address
  VLLM_BASE_URL: "http://REPLACE_WITH_VLLM_SERVICE_HOST:8000/v1"
  VLLM_MODEL: "REPLACE_WITH_VLLM_MODEL_NAME"
