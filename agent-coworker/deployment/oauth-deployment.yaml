apiVersion: apps/v1
kind: Deployment
metadata:
  name: pydantic-assistant-oauth
  labels:
    app: pydantic-assistant
    variant: oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pydantic-assistant
      variant: oauth
  template:
    metadata:
      labels:
        app: pydantic-assistant
        variant: oauth
    spec:
      serviceAccountName: pydantic-assistant
      containers:

        # ── Main application ───────────────────────────────────────────────────
        - name: pydantic-assistant
          image: quay.io/<your-org>/pydantic-assistant:latest
          ports:
            - containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: pydantic-api-keys
          env:
            - name: API_PROVIDER
              value: "anthropic"
            - name: MODEL
              value: "claude-opus-4-5"
            - name: MAX_TURNS
              value: "50"
            - name: MAX_OUTPUT_TOKENS
              value: "16384"
            - name: ALLOW_SHELL
              value: "false"
            - name: SHELL_TIMEOUT
              value: "60"
            - name: PORT
              value: "8081"
            # Bind only to loopback so the app is unreachable except through
            # the OAuth proxy sidecar running in the same pod.
            - name: HOST
              value: "127.0.0.1"
          volumeMounts:
            - name: agent-volume
              mountPath: /app/agent
            - name: input-volume
              mountPath: /app/input
            - name: output-volume
              mountPath: /app/output
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8081
              host: 127.0.0.1
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8081
              host: 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10

        # ── OpenShift OAuth proxy sidecar ──────────────────────────────────────
        # Intercepts all inbound traffic, authenticates users against OpenShift,
        # and forwards authenticated requests to http://localhost:8081.
        #
        # TLS certificate (/etc/tls/private) is auto-generated by OpenShift via
        # the service.alpha.openshift.io/serving-cert-secret-name annotation on
        # oauth-service.yaml (Secret: pydantic-assistant-tls).
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy:latest
          ports:
            - containerPort: 4443
              name: oauth-proxy
              protocol: TCP
          args:
            - --https-address=:4443
            - --provider=openshift
            - --openshift-service-account=pydantic-assistant
            - --upstream=http://localhost:8081
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            # Optional: require users to have 'get' on pods in this namespace.
            # Remove the line below to allow any authenticated OpenShift user.
            # - --openshift-sar={"namespace":"<your-namespace>","resource":"pods","verb":"get"}
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: agent-volume
          persistentVolumeClaim:
            claimName: pydantic-agent-pvc
        - name: input-volume
          persistentVolumeClaim:
            claimName: pydantic-input-pvc
        - name: output-volume
          persistentVolumeClaim:
            claimName: pydantic-output-pvc
        # Auto-created by OpenShift from the serving-cert annotation on oauth-service.yaml
        - name: proxy-tls
          secret:
            secretName: pydantic-assistant-tls
        - name: proxy-secret
          secret:
            secretName: pydantic-proxy-secret
