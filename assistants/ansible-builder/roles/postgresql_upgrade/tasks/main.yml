---
- name: Stop application services accessing PostgreSQL
  ansible.builtin.service:
    name: app_service
    state: stopped

- name: Take VM snapshot
  community.vmware.vmware_guest_snapshot:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: no
    folder: "{{ vm_folder }}"
    name: "{{ inventory_hostname }}"
    datacenter: "{{ datacenter }}"
    vm_id: "{{ inventory_hostname }}"
    state: present
    snapshot_name: "Pre-Upgrade-Snapshot"

- name: Upgrade PostgreSQL to 19.x
  ansible.builtin.shell: |
    yum -y install https://download.postgresql.org/pub/repos/yum/19/redhat/rhel-8-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    yum -y install postgresql19
  args:
    warn: false

- name: Validate PostgreSQL upgrade
  ansible.builtin.shell: |
    psql --version

- name: Perform smoke test
  ansible.builtin.shell: |
    psql -f /path/to/smoke_test.sql -U postgres

- name: Start application services
  ansible.builtin.service:
    name: app_service
    state: started